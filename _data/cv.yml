    Experience:
      - company: William & Mary
        position: "PhD Researcher — Federated Tuning & Structural Pruning for LLMs (SFT-P)"
        start_date: "2025-08"
        end_date: "2026-01"
        location: Williamsburg, VA
        highlights:
          - "Advisor: [Prof. Yanfu Zhang](https://yaz91.github.io/)"
          - "Proposed **SFT-P**: FedAvg-based training that jointly learns client-specific structured pruning masks and adaptation for on-device deployment under non-IID private data; supports mixed client budgets."
          - "Implemented a client-conditioned mask generator (shared hypernetwork + private client embedding) producing hard binary routing masks via Bernoulli gating, and a residual-safe route/merge interface for dense-kernel execution; achieved **+8.5 Avg over the best federated baseline on LLaMA-7B at 50% pruning**. Submitted to **NAACL 2027**."
      - company: William & Mary
        position: "PhD Researcher — In-Context Knowledge Editing for LLMs (DR-IKE / FWE-IKE / MO-IKE)"
        start_date: "2025-08"
        end_date: "present"
        location: Williamsburg, VA
        highlights:
          - "Advisors: [Prof. Yanfu Zhang](https://yaz91.github.io/), [Prof. Haipeng Chen](https://haipeng-chen.github.io/)"
          - "Main contributor to a research line on **retrieval-based in-context knowledge editing** for black-box LLMs, spanning policy-optimized retrieval, confidence-aware fusion, and constrained multi-objective RL."
          - "**DR-IKE** (EMNLP 2025, co-first): trained a BERT retriever via REINFORCE with a learnable threshold to dynamically size demonstrations. [[code]](https://github.com/mwnafee/DR-IKE)"
          - "**FWE-IKE** (ACL 2026 Findings): confidence-gated ensemble of LLM/BERT/MLP rankers with logit-space fusion, closing ~53% of the gap to the oracle on COUNTERFACT."
          - "**MO-IKE** (EMNLP 2026 Findings): formulated prompt construction as a Constrained MDP with Lagrangian relaxation and GRPO, jointly optimizing reliability, generality, and specificity."
      - company: William & Mary
        position: "PhD Researcher — Meta-Path Attention Reliability in Heterogeneous GNNs (MetaXplain)"
        start_date: "2025-08"
        end_date: "2026-02"
        location: Williamsburg, VA
        highlights:
          - "Advisor: [Prof. Yanfu Zhang](https://yaz91.github.io/)"
          - "Conducted a controlled empirical study of whether meta-path attention is a **faithful explanation**, identifying regimes of alignment vs. statistically significant decoupling across multiple datasets and HGNN backbones."
          - "Introduced **MetaXplain**, a meta-path-aware post-hoc analysis protocol (view-factorized explanations, schema-valid perturbations, fusion-aware attribution), and proposed **MP-AEA** to quantify attention–explanation alignment; released an explainability benchmark codebase [ExplainerForHGNN](https://github.com/MaiqiVerse/ExplainerForHGNN) for the community. Submitted to **TMLR** (under review)."
      - company: William & Mary
        position: "PhD Researcher — Biomedical HIN Link Prediction (IM-HIN / PAIRS)"
        start_date: "2025-08"
        end_date: "2026-02"
        location: Williamsburg, VA
        highlights:
          - "Advisor: [Prof. Yanfu Zhang](https://yaz91.github.io/)"
          - "Proposed **PAIRS**: framed protein-phenotype association prediction as **link prediction** over a biomedical heterogeneous information network, rather than per-label classification."
          - "Built **IM-HIN** by integrating STRING, HumanNet XN, GeneMania (protein-protein interactions) and HPO (protein-phenotype associations) into a single graph; two type-specific encoders (protein encoder + phenotype encoder) feed a relation-prediction head."
          - "Accepted at **ICASSP 2026** (first author)."
      - company: William & Mary
        position: "Project Lead — In-Context Task Learning: Reading Out a Kernel Classifier"
        start_date: "2026-02"
        end_date: "present"
        location: Williamsburg, VA
        highlights:
          - "Advisor: [Prof. Yanfu Zhang](https://yaz91.github.io/)"
          - "Identified **mapping-sensitive attention heads** through paired intact/randomized-label contrasts and characterized their outputs as a **kernel classifier** combining query-dependent retrieval with contextual class votes. On **TREC-fine** with Llama-3.1-8B and 180 demonstrations, direct readout from **8 selected heads** achieves **50.3% accuracy**, versus 51.6% for the full model."
          - "Proposed **Selective TL Memory**, reusing cached demonstration K/V through selected heads with live query-dependent retrieval. Selective access improves the same fixed readout across **all 18 natural-language settings** at both tested head budgets; the **30-head readout** outperforms all compared adapted-vector baselines in **14/18 settings**. Submitted to **ICLR 2027** (under review)."
      - company: William & Mary
        position: "Project Mentor — DyV2X: Dynamic Interaction Graphs for V2X Cooperative Trajectory Prediction"
        start_date: "2025-12"
        end_date: "2026-03"
        location: Williamsburg, VA
        highlights:
          - "Advisor: [Prof. Yanfu Zhang](https://yaz91.github.io/)"
          - "Mentored two interns (the first two authors); guided the design of **DyV2X**, a cooperative trajectory prediction framework that constructs per-timestep dynamic interaction graphs and uses a temporal graph attention encoder to jointly model evolving inter-agent interactions and individual kinematic history."
          - "On V2X-Seq-TFD (9,320 target agents), improved over the V2X-Graph baseline on all metrics: **ADE** 1.110→0.952 (**14.2%↓**), **FDE** 1.894→1.664 (**12.1%↓**), **MR@2m** 27.9%→24.7%."
          - "Largest gains on safety-critical turning maneuvers (e.g., *left turn*: FDE 4.216→2.646, **37.2%↓**; MR@2m 64.2%→47.5%). Submitted to **ICRA 2027** (under review)."
      - company: William & Mary
        position: "Project Mentor — Intern-led Projects on LLM Efficiency & Long-Context"
        start_date: "2025-09"
        end_date: "present"
        location: Williamsburg, VA
        highlights:
          - "Advisor: [Prof. Yanfu Zhang](https://yaz91.github.io/)"
          - "**Domain-Adaptive Pruning (CDAM).** Mentoring *Noman Ali* on a **training-free activation measure** combining domain-specific and general-purpose statistics with feature-wise cross-domain interactions, integrated into Wanda and CFSP. On Llama-2-13B at **50% sparsity** with 1,024 calibration examples, CDAM raises CFSP's average biomedical accuracy from **34.45% to 38.70%** versus naive calibration mixing, while improving general-task accuracy from 58.73% to 61.32%. Targeting **ACL 2027**."
          - "**ICL-Preserving Pruning (ICLPrune).** Mentoring *Chongyuan Sun* on improving pruned-LLM **in-context learning** performance under task-shifted prompts via demonstration-aware calibration (*ICLPrune: Improving In-Context Learning in Structured LLM Pruning via Demonstration-Aware Calibration*, targeting **ACL 2027**)."
          - "**Long-Context & ICL.** Proposed the research direction and co-supervised (with Prof. Zhang) *Yiran Ding* on the **cross-lingual gap in long-context reasoning** under context-extension methods, leading to *One Direction Away: The Cross-Lingual Gap in Long-Context Reasoning and a Shift That Closes It* (submitted to **NAACL 2027**); mentoring *Muhammed Muminul Hoque* on demonstration-ordering policies for ICL motivated by the **Lost-in-the-Middle** effect, given per-example rankings."
      - company: Independent / Open Source
        position: "Project Lead — lmdiff: Behavioral Diagnostics for LLM Configurations"
        start_date: "2025-10"
        end_date: "present"
        location: Williamsburg, VA
        highlights:
          - "Advisor: [Prof. Yanfu Zhang](https://yaz91.github.io/)"
          - "Built and released **lmdiff** ([PyPI `lmdiff-kit`](https://pypi.org/project/lmdiff-kit/), [GitHub](https://github.com/MaiqiVerse/lmdiff)), a Python library for comparing LLM **configurations**—weights + system prompt + decoding + adapter—via behavioral distance and multi-level diagnostics, rather than aggregate benchmark scalars."
          - "Centered the API on a `family()` abstraction that compares one base configuration against N variants on a shared set of probe-domain axes, treating weight modifications (fine-tuning, RLHF, adapters), runtime modifications (system prompt, decoding, ICL context), and quantization/pruning as first-class variants. Geometry-level metrics (per-domain drift, share, raw + selective cross-variant cosine) quantify *where* each variant moves and whether different modifications push in the same direction. Showcase 7-variant Llama-2-7B family reveals a system prompt can reshape next-token distributions more than 7B→13B scaling."
          - "Engineering: engine layer with HF Transformers + mock backends, engine reuse that keeps peak VRAM at base + 1 active variant in 7-variant families, lm-eval-harness multi-task probe loader with task→domain mapping, JSON schema versioning with auto-recompute on load, 5-channel reporting (ANSI / PNG / HTML / Markdown / JSON), ~860 tests. Active development; representation, trajectory, and causal metrics planned for v0.4+."
      - company: The Hong Kong Polytechnic University
        position: "Researcher — Automated Heterogeneous Network Learning (AutoGNR)"
        start_date: "2021-11"
        end_date: "2023-02"
        location: Hong Kong
        highlights:
          - "Advisor: [Prof. Xiao Huang](https://www4.comp.polyu.edu.hk/~xiaohuang/)"
          - "Co-developed **AutoGNR**, using differentiable NAS to automatically select heterogeneous aggregation paths and node-type combinations—conceptually aligned with structured pruning and bi-level optimization. [[AutoGNR]](https://github.com/MaiqiVerse/AutoGNR) [[HINBaselines]](https://github.com/MaiqiVerse/HINBaselines)"
          - "Designed a non-recursive message-passing scheme that decouples path search from depth, improving search efficiency on large heterogeneous graphs."
      - company: City University of Hong Kong
        position: "Research Assistant — Temporal User Engagement Modeling in Polarized Social Platforms"
        start_date: "2023-02"
        end_date: "2023-12"
        location: Hong Kong
        highlights:
          - "Advisor: [Prof. Junming Liu](http://www.is.cityu.edu.hk/staff/junmiliu/)"
          - "Fused image/video content features with text and interaction context via a temporal GNN for forecasting user engagement across polarized communities on Twitter/Reddit."
          - "Built multimodal feature pipelines and longitudinal datasets for studying engagement dynamics under polarization. [[RedditProcess]](https://github.com/MaiqiVerse/RedditProcess) [[RedditDataset]](https://github.com/MaiqiVerse/RedditDataset)"
          - "Submitted as a short paper to **ICIS 2023**, proposing a counter-party graph attention network with sentiment diffusion for online engagement prediction."
      - company: Neusoft Inc.
        position: "Software Developer Intern"
        start_date: "2020-09"
        end_date: "2020-09"
        location: Shenyang, China
      - company: Northeastern University, China
        position: "Undergraduate Researcher / Bachelor's Thesis — Semi-supervised Learning for Whole-Slide Pathology Images (WSI)"
        start_date: "2018-11"
        end_date: "2021-06"
        location: Shenyang, China
        highlights:
          - "Advisor: [Prof. Xiaoyu Cui](http://faculty.neu.edu.cn/cuixy/zh_CN/)"
          - "Developed weakly-/semi-supervised pipelines for gigapixel WSI using eye-tracking signals, focusing on efficient patch sampling and large-scale image processing. [[Modeling]](https://github.com/MaiqiVerse/WSI-with-Gaze-Modeling) [[Processing]](https://github.com/MaiqiVerse/WSI-with-Gaze-Processing)"
          - "Maintained reusable WSI tooling (tiling, feature extraction, dataset management) used across the lab's projects."

