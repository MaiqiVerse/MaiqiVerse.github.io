    Technical Skills:
      - label: LLM Training & Adaptation
        details: "Federated LLM tuning with FedAvg; structured pruning with learned binary masks and dense-kernel route/merge execution (LLaMA-7B); HuggingFace + PyTorch."
      - label: RL for LLMs
        details: "REINFORCE-based and GRPO-based retrieval / policy optimization for in-context knowledge editing (DR-IKE, MO-IKE); reward design under Constrained MDP with Lagrangian relaxation."
      - label: Graph Learning
        details: "Heterogeneous GNNs (HAN/HGT-family), temporal graph networks (TGN / DyGFormer), differentiable NAS over heterogeneous aggregation paths; PyG-style implementation."
      - label: Mechanistic Interpretability
        details: "Attention head analysis for ICL; sparse autoencoder (SAE) representation interventions with ReFT; meta-path attention faithfulness diagnostics."
      - label: Systems & Tooling
        details: "Python library design and PyPI release (`lmdiff-kit`); multi-codebase open-source benchmarks (ExplainerForHGNN, HINBaselines); large-scale data pipelines for WSI and multimodal social media; mentoring code reviews across 4 intern projects."
      - label: Languages
        details: "Python, PyTorch, C++. Spoken: Chinese (native), English (fluent)."

    Research Interests:
      - bullet: "What interventions actually change inside an LLM — structured pruning, knowledge editing, adapters, decoding"
      - bullet: "Building interventions that preserve the capabilities that matter (in-context learning, domain knowledge, factual reliability)"
      - bullet: "Mechanistic analysis of in-context learning and of attention-based explanations"
      - bullet: "RL-based methods for LLMs (policy-optimized retrieval, constrained multi-objective RL)"
      - bullet: "Federated / on-device LLM adaptation and model compression"
      - bullet: "Behavioral diagnostics and released tooling for LLM configurations"
      - bullet: "Graph learning and explainability (heterogeneous GNNs, biomedical HINs, V2X)"

